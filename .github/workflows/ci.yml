name: CI

# Runs the same gate the project expects locally (`npm run verify`), so a change
# that breaks the runtime preconditions, types, lint, the characterisation tests,
# or the production build cannot land unnoticed.
#
# The last step is not a compiler check: it starts the built server and exercises
# it — pages, API contracts, the production-only security headers — so a change
# that breaks responses is caught even when the build is fine.
#
# Browser checks (viewer framing and layers, the results states) are still not
# automated — they need a headless browser suite. Until then they are run
# manually against `npm run dev`; see ARCHITECTURE.md §8.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run smoke
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run smoke:server
